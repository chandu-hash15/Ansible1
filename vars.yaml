- name: using variables in tasks
  hosts: local
  connection: local
  vars:
    name: chandu
    works_at: planful
    position: DevOps Engineer
  tasks:
  - name: printing details from playbook 2
    vars:
      name: tharun
    ansible.builtin.debug:
     msg: ame {{name}}, works at {{works_at}}, as a {{position}}